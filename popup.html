<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 14px;
        width: 300px;
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        font-size: 13px;
        color: #1f2023;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        color: #4a4d55;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c4c7cc;
        flex: none;
      }
      .dot.ok {
        background: #2eb84b;
      }
      .dot.bad {
        background: #e03b3b;
      }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1px solid #d0d3d8;
        background: #f5f6f7;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: #d6001c;
        border-color: #d6001c;
        color: #fff;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .hint {
        margin: 10px 0 0;
        color: #6a6e77;
        font-size: 12px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>HH Cover Letter</h1>

    <div class="check"><span class="dot" id="keyDot"></span><span id="keyText">API-ключ DeepSeek</span></div>
    <div class="check"><span class="dot" id="resumeDot"></span><span id="resumeText">Резюме загружено</span></div>

    <button class="primary" id="generate" disabled>Сгенерировать на открытой вакансии</button>
    <button id="openOptions">Настройки</button>
    <button id="openResume">Открыть мои резюме на hh.ru</button>

    <p class="hint" id="hint"></p>

    <script src="popup.js"></script>
  </body>
</html>
